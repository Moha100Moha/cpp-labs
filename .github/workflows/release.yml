name: 'C++ CI' #Название workflow, оно отображается во вкладке Actions.

#Когда запускать: при каждом push в ветки main и feature/github_actions. Это выполняет требование "сборка на каждый commit".

on:
  push: 
    branches:
      - main
      - feature/github_actions

jobs:
  build: #Один job с именем build. Он идёт на виртуальной машине с Ubuntu
    runs-on: ubuntu-latest 
    permissions: write-all #даёт Actions право создавать релизы.
    steps:
      - uses: actions/checkout@v3  #Скачивает код твоего repo на виртуальную машину
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }} #это номер запуска workflow (1, 2, 3...). Он увеличивается сам при каждом push. Именно он и становится N
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    #это безопасный способ дать доступ 
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./helloworld-1.0.${{ github.run_number }}-Linux.deb
          asset_name: helloworld-1.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package
  
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - run: brew install boost
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      - run: cmake --build .
      - run: cmake --build . --target test